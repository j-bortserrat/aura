name: Hornear Carta y Talleres

on:
  schedule:
    # 04:00 UTC = 06:00 (CEST) / 05:00 (CET) en Valencia — antes de abrir.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bake-content
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hornear contenido de las Sheets en carta/talleres (ES+EN)
        run: node scripts/bake-content.mjs

      - name: Commitear si hay cambios
        run: |
          git config user.name "aura-bake-bot"
          git config user.email "actions@users.noreply.github.com"
          git add carta.html en-carta.html eventos.html en-eventos.html talleres-images.json images/talleres/
          if git diff --cached --quiet; then
            echo "Sin cambios en la carta o talleres."
          else
            git commit -m "chore: actualizar carta y talleres desde Google Sheets"
            git push
          fi
